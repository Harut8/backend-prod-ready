# =============================================================================
# kinonee - Development Nginx Configuration
# Optimized for load testing with relaxed limits and better access
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx/nginx.pid;

# Worker optimization for load testing
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;  # Increased for load testing
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # LOGGING (More verbose for development)
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # =========================================================================
    # PERFORMANCE OPTIMIZATIONS
    # =========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;      # Increased for load testing
    keepalive_requests 1000;    # Increased for load testing
    types_hash_max_size 2048;
    server_tokens off;

    # File upload size limits (more permissive for dev)
    client_max_body_size 50M;
    client_body_buffer_size 256k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 32k;

    # Timeouts (more permissive for debugging)
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # =========================================================================
    # GZIP COMPRESSION
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;  # Lower compression for faster response in dev
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    gzip_min_length 256;

    # =========================================================================
    # RATE LIMITING (VERY RELAXED FOR LOAD TESTING)
    # =========================================================================
    # Define rate limiting zones with MUCH higher limits for dev/testing
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/s;    # 1000 req/sec for load testing
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=500r/s;  # Even "strict" is permissive in dev
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Connection limiting (very permissive for load testing)
    limit_conn conn_limit 100;

    # =========================================================================
    # UPSTREAM BACKEND
    # =========================================================================
    upstream backend_app {
        least_conn;
        server backend:8000 max_fails=5 fail_timeout=10s;
        keepalive 256;          # Much higher for load testing
        keepalive_requests 10000; # More requests per connection
        keepalive_timeout 120s;  # Longer timeout
    }

    # =========================================================================
    # INCLUDE SITE CONFIGURATIONS
    # =========================================================================
    include /etc/nginx/conf.d/*.dev.conf;
}
