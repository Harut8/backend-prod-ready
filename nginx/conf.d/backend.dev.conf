# =============================================================================
# kinonee - Development Server Configuration
# Optimized for load testing with minimal rate limiting and full access
# =============================================================================

server {
    listen 80;
    server_name _;

    # =========================================================================
    # MINIMAL SECURITY HEADERS (Development mode)
    # =========================================================================

    # Basic headers only - allows easier debugging
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Permissive CSP for development (allows all origins for testing)
    add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;" always;

    # =========================================================================
    # HEALTH CHECK ENDPOINT (No rate limiting)
    # =========================================================================
    location /api/v1/system/health {
        access_log off;
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Basic proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Quick timeouts for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # METRICS ENDPOINT (No rate limiting in dev)
    # =========================================================================
    location /metrics {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # WEBHOOK ENDPOINTS (Minimal rate limiting for testing)
    # =========================================================================
    location ~* ^/api/v1/(billing/webhooks|webhooks) {
        # Very permissive rate limit for testing
        limit_req zone=strict_limit burst=100 nodelay;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
    }

    # =========================================================================
    # ADMIN PANEL (NO RESTRICTIONS IN DEV - FULL ACCESS)
    # =========================================================================

    # Admin static files - no rate limiting
    location /admin/statics {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No caching in dev for live updates
        proxy_cache_valid 200 1m;
        expires 1m;
    }

    # Admin dynamic pages - VERY permissive rate limiting
    location /admin {
        # Very high burst for admin operations in dev
        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Generous timeouts for debugging
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # =========================================================================
    # API DOCUMENTATION (Always accessible in dev)
    # =========================================================================
    location ~* ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # STATIC FILES (If serving from Nginx)
    # =========================================================================
    location /static {
        alias /app/static;
        expires 1m;  # Short cache in dev
        add_header Cache-Control "public";
        access_log off;
    }

    location /media {
        alias /app/media;
        expires 1m;  # Short cache in dev
        add_header Cache-Control "public";
        access_log off;
    }

    # =========================================================================
    # MAIN API ENDPOINTS (Minimal rate limiting for load testing)
    # =========================================================================
    location / {
        # Very permissive rate limiting for load testing
        # 1000 req/sec with burst of 500 extra requests
        limit_req zone=api_limit burst=500 nodelay;

        # Proxy to backend application
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Essential headers for FastAPI behind reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Generous timeouts for development/debugging
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings optimized for load testing
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;

        # Proxy request buffering (for large uploads)
        proxy_request_buffering on;

        # Hide backend headers
        proxy_hide_header X-Powered-By;
    }

    # =========================================================================
    # ERROR PAGES
    # =========================================================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
