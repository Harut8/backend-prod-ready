# =============================================================================
# kinonee - Production Server Configuration
# FastAPI application with comprehensive security headers
# =============================================================================

server {
    listen 80;
    server_name _;

    # For production with SSL, uncomment and configure:
    # listen 443 ssl http2;
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # =========================================================================
    # SECURITY HEADERS (Applied to all responses)
    # =========================================================================

    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy for privacy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy (formerly Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS - Force HTTPS (enable when SSL is configured)
    # Uncomment the line below after configuring SSL certificates:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (allows Swagger UI from CDN)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self'" always;

    # =========================================================================
    # HEALTH CHECK ENDPOINT (No rate limiting)
    # =========================================================================
    location /api/v1/system/health {
        access_log off;
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Basic proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # METRICS ENDPOINT (Restricted to internal networks only)
    # =========================================================================
    location /metrics {
        access_log off;
        # Restrict to internal IPs only
        allow 172.16.0.0/12;  # Docker internal network
        allow 10.0.0.0/8;      # Private network
        allow 192.168.0.0/16;  # Private network
        allow 127.0.0.1;       # Localhost
        deny all;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # WEBHOOK ENDPOINTS (Strict rate limiting)
    # =========================================================================
    location ~* ^/api/v1/(billing/webhooks|webhooks) {
        limit_req zone=strict_limit burst=5 nodelay;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Proxy headers for FastAPI behind proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended timeouts for webhooks
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # =========================================================================
    # ADMIN PANEL (Can be restricted by IP in production)
    # =========================================================================

    # Admin static files - no rate limiting for CSS/JS/fonts
    location /admin/statics {
        # Restrict admin access to internal networks
        allow 172.16.0.0/12;  # Docker internal network
        allow 10.0.0.0/8;     # Private network
        allow 192.168.0.0/16; # Private network
        allow 127.0.0.1;      # Localhost
        # Add your office/VPN IP here:
        # allow 1.2.3.4;
        deny all;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Admin dynamic pages - rate limited (more permissive for admin operations)
    location /admin {
        # Restrict admin access to internal networks
        allow 172.16.0.0/12;  # Docker internal network
        allow 10.0.0.0/8;     # Private network
        allow 192.168.0.0/16; # Private network
        allow 127.0.0.1;      # Localhost
        # Add your office/VPN IP here:
        # allow 1.2.3.4;
        deny all;

        limit_req zone=api_limit burst=20 nodelay;  # Use general API limit instead of strict

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # API DOCUMENTATION (OpenAPI/Swagger) - Restricted in production
    # =========================================================================
    location ~* ^/(docs|redoc|openapi.json) {
        # Restrict API docs to internal networks only
        allow 172.16.0.0/12;  # Docker internal network
        allow 10.0.0.0/8;     # Private network
        allow 192.168.0.0/16; # Private network
        allow 127.0.0.1;      # Localhost
        # Add your office/VPN IP here for external access:
        # allow 1.2.3.4;
        deny all;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # STATIC FILES (If serving from Nginx)
    # =========================================================================
    location /static {
        alias /app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media {
        alias /app/media;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # =========================================================================
    # MAIN API ENDPOINTS (Standard rate limiting)
    # =========================================================================
    location / {
        # Apply general rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy to backend application
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Essential headers for FastAPI behind reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Proxy request buffering (for large uploads)
        proxy_request_buffering on;

        # Hide backend headers
        proxy_hide_header X-Powered-By;
    }

    # =========================================================================
    # ERROR PAGES
    # =========================================================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
