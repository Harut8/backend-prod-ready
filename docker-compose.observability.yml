# =============================================================================
# kinonee - Observability Stack
# Jaeger (tracing), Prometheus (metrics), Grafana (dashboards)
#
# Usage:
#   make tracing        # Start with Jaeger tracing
#   make tracing-down   # Stop tracing stack
# =============================================================================

services:
  # =============================================================================
  # JAEGER - Distributed Tracing
  # UI: http://localhost:16686
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: kinonee-jaeger
    hostname: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    networks:
      - kinonee-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # BACKEND OVERRIDES - Enable tracing to Jaeger
  # =============================================================================
  backend:
    environment:
      - TRACING_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=kinonee
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
      - METRICS_ENABLED=true
    depends_on:
      jaeger:
        condition: service_healthy

  # =============================================================================
  # PROMETHEUS - Metrics Collection (uncomment to enable)
  # UI: http://localhost:9090
  # =============================================================================
