# =============================================================================
# prod-ready-backend - Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides the base docker-compose.yml for production deployments:
# - Adds Nginx reverse proxy with SSL support
# - Removes direct port exposure from backend
# - Uses production build targets
# - Disables development volumes
# - Enables production optimizations
# =============================================================================

services:
  # =============================================================================
  # NGINX REVERSE PROXY (Production)
  # =============================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: prb-nginx
    hostname: nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      # Mount SSL certificates (uncomment in production with SSL)
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # Custom Nginx configs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Logs
      - nginx_logs:/var/log/nginx
    networks:
      - prb-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # =============================================================================
  # BACKEND SERVICE (Production overrides)
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: app.Dockerfile
      target: runtime
      args:
        ENV_STAGE: production
    restart: always
    # Remove direct port exposure - only accessible via Nginx
    ports: []
    expose:
      - "8000"
    environment:
      - ENV_STAGE=production
      - FORWARDED_ALLOW_IPS=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      - RATE_LIMIT_ENABLED=true
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - PYTHONOPTIMIZE=2
      - PYTHONUNBUFFERED=1
    volumes:
      # Remove code mount in production (no hot-reload)
      - backend_logs:/app/logs
    networks:
      - prb-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # =============================================================================
  # DATABASE SERVICE (Production overrides)
  # =============================================================================
  postgres:
    restart: always
    # Remove port exposure in production (only accessible internally)
    ports: []
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Production-optimized PostgreSQL settings
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c log_connections=on
      -c log_disconnections=on
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # =============================================================================
  # REDIS SERVICE (Production overrides)
  # =============================================================================
  redis:
    restart: always
    # Remove port exposure in production
    ports: []
    expose:
      - "6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# =============================================================================
# VOLUMES (Production)
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: prb-postgres-data-prod
  redis_data:
    driver: local
    name: prb-redis-data-prod
  backend_logs:
    driver: local
    name: prb-backend-logs-prod
  nginx_logs:
    driver: local
    name: prb-nginx-logs-prod

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  prb-network:
    driver: bridge
    name: prb-network-prod
