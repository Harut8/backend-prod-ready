[project]
name = "prod-ready-backend"
version = "0.1.0"
description = "Production-ready FastAPI backend template"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "granian[uvloop]>=2.6.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "SQLAlchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "httpx>=0.28.0",
  "PyJWT[crypto]>=2.8.0",
  "cryptography>=45.0.0",
  "google-auth>=2.29.0",
  "redis>=5.0.4",
  "starlette-admin>=0.14.0",
  "slowapi>=0.1.9",
  "structlog>=24.1.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1.0", # Pin bcrypt for passlib compatibility
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "dependency-injector>=4.41.0",
  "requests>=2.32.5",
  # Security-pinned transitive dependencies (CVE fixes)
  "urllib3>=2.6.3", # CVE-2025-66471, CVE-2025-50181, CVE-2025-66418, CVE-2025-50182
  "starlette>=0.49.1", # CVE-2025-62727 (DoS via Range header)
  "anyio>=4.4.0", # PVE-2024-71199 (race condition fix)
  "filelock>=3.20.1", # CVE-2025-68146 (TOCTOU symlink)
  "protobuf>=5.29.5", # CVE-2025-4565 (DoS via recursion)
  "marshmallow>=4.1.2", # CVE-2025-68480 (DoS)
  "authlib>=1.6.5", # CVE-2025-62706, CVE-2025-61920 (DoS)
  "requests>=2.32.4", # CVE-2024-47081
  "python-jose>=3.4.0", # CVE-2024-33664, CVE-2024-33663
  "email-validator>=2.3.0",
  "uuid7>=0.1.0",
  "python-json-logger>=3.3.0",
  "orjson>=3.11.3",
  "psycopg2-binary>=2.9.11",
  "tenacity>=9.1.2",
  "purgatory>=1.0.0", # Circuit breaker pattern for async payment gateway resilience
  "gunicorn>=21.2.0", # Production WSGI server with worker management
  "pyotp>=2.9.0", # TOTP implementation for admin MFA (2-factor authentication)
  "qrcode>=8.2",
  "dbos>=1.0.0", # DBOS framework for durable workflows and exactly-once execution
  "greenlet>=3.2.4",
  "python-slugify>=8.0.0",
  "pyinstrument>=4.6.0", # Production-ready profiling with async support
  "prometheus-client>=0.20.0", # Prometheus metrics for monitoring
  "opentelemetry-api>=1.24.0", # OpenTelemetry API for distributed tracing
  "opentelemetry-sdk>=1.24.0", # OpenTelemetry SDK
  "opentelemetry-instrumentation-fastapi>=0.45b0", # FastAPI instrumentation
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0", # SQLAlchemy instrumentation
  "opentelemetry-instrumentation-redis>=0.45b0", # Redis instrumentation
  "opentelemetry-exporter-otlp>=1.24.0", # OTLP exporter for tracing backends
  "identity-plan-kit[admin]>=0.3.1", # Authentication, RBAC, and subscription plan management with admin panel (local dev)
  "sqladmin>=0.20.0", # SQLAdmin for database admin interface
]

[dependency-groups]
dev = [
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "httpx>=0.27.0",
  "types-passlib>=1.7.7.20250602",
  "pre-commit>=4.0.0",
  "py-spy>=0.3.14",  # External process profiler for production debugging
  "fakeredis>=2.21.0",  # Mock Redis for testing
  "safety>=3.2.0",
  "testcontainers[postgres,redis]>=4.0.0",  # Docker containers for integration tests
  "aiosqlite>=0.20.0",  # Async SQLite for lightweight tests
]
load-test = [
  "locust>=2.20.0",     # Modern load testing framework with web UI
  "aiohttp>=3.9.0",     # Async HTTP client for metrics collection
  "pyyaml>=6.0",        # Configuration file parsing
  "jinja2>=3.1.0",      # Report template generation
  "click>=8.1.0",       # CLI interface for scripts
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# PACKAGE DISCOVERY
# =============================================================================
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "*.tests*", "*.egg-info*"]

# =============================================================================
# MYPY - Type Checking Configuration
# =============================================================================
[tool.mypy]
mypy_path = "backend"
plugins = ["pydantic.mypy"]
strict = true
explicit_package_bases = true
exclude = '''(?x)^(
    |alembic/.*
    |migrations/.*
    |tests/.*
    |.*/__pycache__/.*
    |.*\.egg-info/.*
)$'''
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
disallow_subclassing_any = false
follow_imports = "silent"
show_error_codes = true
show_column_numbers = true
ignore_missing_imports = true
pretty = true
allow_redefinition = false

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
follow_imports = "skip"

# =============================================================================
# RUFF - Linting & Formatting
# =============================================================================
[tool.ruff]
exclude = [
    "alembic",
    "migrations",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "C",    # mccabe rules
    "F",    # pyflakes rules
    "E",    # pycodestyle error rules
    "W",    # pycodestyle warning rules
    "B",    # flake8-bugbear rules
    "I",    # isort rules
    "N",    # pep8-naming rules
    "UP",   # pyupgrade rules
    "ANN",  # flake8-annotations rules
    "S",    # flake8-bandit security rules
    "BLE",  # flake8-blind-except rules
    "FBT",  # flake8-boolean-trap rules
    "A",    # flake8-builtins rules
    "COM",  # flake8-commas rules
    "C4",   # flake8-comprehensions rules
    "DTZ",  # flake8-datetimez rules
    "T10",  # flake8-debugger rules
    "EM",   # flake8-errmsg rules
    "FA",   # flake8-future-annotations rules
    "ISC",  # flake8-implicit-str-concat rules
    "ICN",  # flake8-import-conventions rules
    "G",    # flake8-logging-format rules
    "INP",  # flake8-no-pep420 rules
    "PIE",  # flake8-pie rules
    "T20",  # flake8-print rules
    "PT",   # flake8-pytest-style rules
    "Q",    # flake8-quotes rules
    "RSE",  # flake8-raise rules
    "RET",  # flake8-return rules
    "SLF",  # flake8-self rules
    "SIM",  # flake8-simplify rules
    "TID",  # flake8-tidy-imports rules
    "TCH",  # flake8-type-checking rules
    "ARG",  # flake8-unused-arguments rules
    "PTH",  # flake8-use-pathlib rules
    "ERA",  # eradicate rules
    "PD",   # pandas-vet rules
    "PGH",  # pygrep-hooks rules
    "PL",   # pylint rules
    "TRY",  # tryceratops rules
    "FLY",  # flynt rules
    "NPY",  # numpy rules
    "PERF", # perflint rules
    "FURB", # refurb rules
    "LOG",  # flake8-logging rules
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",    # Do not perform function calls in argument defaults
    "S101",    # Use of assert detected
    "S104",    # Possible binding to all interfaces
    "S108",    # Probable insecure usage of temp file/directory
    "S311",    # Standard pseudo-random generators are not suitable for security/cryptographic purposes
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicitly concatenated string literals on one line (conflicts with formatter)
    "INP001",  # File is part of an implicit namespace package
]
task-tags = ["HACK"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlalchemy.orm.DeclarativeBase"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
split-on-trailing-comma = true
force-single-line = false
force-sort-within-sections = true
combine-as-imports = true
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "pydantic.validator",
    "declared_attr",
    "expression",
    "comparator",
]

# =============================================================================
# PYTEST
# =============================================================================
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may require external services)",
    "slow: Slow running tests",
]

# =============================================================================
# UV
# =============================================================================
[tool.uv]
dev-dependencies = [
    "import-linter>=2.5.2",
    "pre-commit>=4.3.0",
]

