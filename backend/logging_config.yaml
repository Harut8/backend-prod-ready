version: 1
disable_existing_loggers: false

# ============================================================================
# FORMATTERS
# ============================================================================
# - default/detailed: Human-readable for dev/local (used when JSON_LOGS=false)
# - json: Structured JSON for non-structlog loggers in production
# - passthrough: For structlog loggers (they output JSON already)
# ============================================================================

formatters:
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(funcName)s:%(lineno)d - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(module)s %(funcName)s %(lineno)d %(message)s'
    datefmt: '%Y-%m-%dT%H:%M:%S%z'
    json_ensure_ascii: false

  passthrough:
    format: '%(message)s'

  # Structlog-style formatter for stdlib loggers (slowapi, etc.)
  structlog_console:
    (): backend.core.observability.logging.StructlogStyleFormatter

# ============================================================================
# HANDLERS
# ============================================================================
# Text handlers (default/detailed): Used when JSON_LOGS=false (dev/local)
# *_json handlers (passthrough): For structlog loggers in production
# *_json_structured handlers: For standard library loggers in production
# ============================================================================

handlers:
  # ----- Console Handlers -----
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

  # Structlog-style console for stdlib loggers (uvicorn, slowapi, etc.)
  console_structlog:
    class: logging.StreamHandler
    level: INFO
    formatter: structlog_console
    stream: ext://sys.stdout

  # Passthrough console for structlog loggers (output already formatted)
  console_passthrough:
    class: logging.StreamHandler
    level: DEBUG
    formatter: passthrough
    stream: ext://sys.stdout

  console_json:
    class: logging.StreamHandler
    level: INFO
    formatter: passthrough
    stream: ext://sys.stdout

  console_json_structured:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  # ----- File Handlers (app.log) -----
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /app/logs/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  file_json:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: passthrough
    filename: /app/logs/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  file_json_structured:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: /app/logs/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  # ----- Error File Handlers (error.log) -----
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /app/logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  error_file_json:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: passthrough
    filename: /app/logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  error_file_json_structured:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: json
    filename: /app/logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

# ============================================================================
# LOGGERS
# ============================================================================
# Handler selection is dynamic based on JSON_LOGS setting (see logging.py)
# - JSON_LOGS=false (dev): Uses text handlers (console, file, error_file)
# - JSON_LOGS=true (prod): Uses JSON handlers (*_json, *_json_structured)
# ============================================================================

loggers:
  # ----- ASGI Server Loggers -----
  # Uvicorn (fallback compatibility)
  uvicorn:
    level: INFO
    handlers: [console_structlog, file]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [console_structlog, error_file]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [console_structlog, file]
    propagate: false

  # Granian server (uses _granian internally)
  _granian:
    level: INFO
    handlers: [console_structlog, file, error_file]
    propagate: false

  granian.access:
    level: INFO
    handlers: [console_structlog, file]
    propagate: false

  # ----- Application Logger -----
  app:
    level: DEBUG
    handlers: [console_structlog, file, error_file]
    propagate: false

  # ----- Database Loggers -----
  sqlalchemy:
    level: WARNING
    handlers: [console_structlog, file]
    propagate: false

  sqlalchemy.engine:
    level: WARNING
    handlers: [file]
    propagate: false

  # ----- External Services -----
  httpx:
    level: WARNING
    handlers: [console_structlog, file]
    propagate: false

  openai:
    level: INFO
    handlers: [console_structlog, file]
    propagate: false

  # ----- Framework Loggers -----
  dbos:
    level: INFO
    handlers: [console_structlog, file]
    propagate: false

  slowapi:
    level: INFO
    handlers: [console_structlog, file]
    propagate: false

  # ----- Development Utilities -----
  # Suppress noisy watchfiles INFO logs when using --reload
  watchfiles:
    level: WARNING
    handlers: [console_structlog]
    propagate: false

# ============================================================================
# ROOT LOGGER
# ============================================================================
# All loggers use ProcessorFormatter (console_structlog) for consistent output
# ProcessorFormatter handles both structlog and stdlib logs uniformly
root:
  level: INFO
  handlers: [console_structlog, file, error_file]
