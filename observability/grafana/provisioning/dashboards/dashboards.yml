# =============================================================================
# Grafana Dashboard Provisioning
# Add JSON dashboard files to this directory and they'll be auto-imported
# =============================================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'kinonee'
    folderUid: 'kinonee'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
