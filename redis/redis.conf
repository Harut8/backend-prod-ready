# =============================================================================
# kinonee - Redis Configuration
# Production-ready Redis configuration for caching and session management
# =============================================================================

# Network and Security
# In Docker, bind to all interfaces - network isolation is handled by Docker
# Production: ports: [] in docker-compose.prod.yml ensures no external exposure
# Only containers on the same Docker network can connect
bind 0.0.0.0
protected-mode yes
port 6379

# Authentication: Password is passed via command line in docker-compose
# This is visible in `docker inspect` but mitigated by:
# 1. Docker network isolation (no external port exposure in production)
# 2. Container-only access on internal kinonee-network
# For enhanced security, consider Docker Swarm secrets or external secrets manager
# DO NOT hardcode passwords in this file

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence Configuration
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance Optimization
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Advanced Configuration
databases 16
always-show-logo yes

# Note: Password configured at top of file via requirepass directive

# Append Only File (AOF) for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
